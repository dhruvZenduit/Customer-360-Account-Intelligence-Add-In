<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer 360 — Command Center</title>

    <link rel="stylesheet" href="addin.css" />

    <!--
        Inter for the UI, JetBrains Mono for every number.

        Loaded after addin.css, which already declares a full fallback stack for
        both, so the interface is correct with no webfont at all — a useful
        property for an add-in that may be opened on a locked-down machine. No
        internal data crosses this boundary; it is a font request.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
</head>
<body>
    <!--
        Root container.

        Every id and class is prefixed "c360-" because MyGeotab injects this
        page into its own DOM — unprefixed names would collide with, or leak
        styles into, MyGeotab itself. Same convention as the other add-ins
        in this org ("dsc-", "sec-").

        That constraint is also why there is no CSS framework here: a utility
        framework's global preflight would reset MyGeotab's own interface, not
        just this page.
    -->
    <div id="c360-app" class="c360-appshell">

        <!-- ============================================================
             Left navigation rail.

             Collapsed to an icon strip, expanding on hover or focus-within.
             Rendered by js/ui/shell.js so the active screen and the
             account-dependent items stay in sync with app state.
             ============================================================ -->
        <nav id="c360-rail" class="c360-rail" aria-label="Primary"></nav>

        <div class="c360-shell">

            <!-- ========================================================
                 Command header: product line, screen title, live clock,
                 system status, search, Portfolio AI, Refresh.

                 Deliberately compact. A command center that spends 200px
                 on its own name is one you scroll past every morning.
                 ======================================================== -->
            <header id="c360-cmdhead" class="c360-cmdhead"></header>

            <!-- Portfolio status strip: five figures, monospace, one row. -->
            <div id="c360-strip" class="c360-strip" hidden></div>

            <!--
                Mock-data banner. Shown whenever the active data source is the
                bundled sample set, on every screen, so invented records can
                never be mistaken for the real account picture.
            -->
            <div id="c360-mock-banner" class="c360-mock-banner" role="note" hidden></div>

            <!--
                The main workspace. Holds whichever screen is active: the
                three-panel Command Center, the account list, the signal feed,
                the account detail workspace, or settings.
            -->
            <div id="c360-portfolio" class="c360-portfolio"></div>

            <!-- Page-level error state -->
            <div id="c360-error" class="c360-error" role="alert" hidden></div>

            <!-- ========================================================
                 The rest of this column is the ORIGINAL account view,
                 unchanged in behaviour and still rendered by the same
                 code. On the Intelligence screen it appears beneath the
                 account workspace.
                 ======================================================== -->

            <!-- Account header: name, industry, key facts -->
            <div id="c360-account-header" class="c360-account-header" hidden></div>

            <!-- Per-source load status: internal / website / external -->
            <div id="c360-source-status" class="c360-source-status" hidden></div>

            <!-- Filters and the records-as-of stamp -->
            <div id="c360-toolbar" class="c360-toolbar" hidden></div>

            <!--
                The Phase 7 scorecard block: health arithmetic, priority
                explanation, confidence per source, evidence drawers, drafts
                and feedback controls. Rendered inside the account workspace.
            -->
            <div id="c360-scorecard-block" class="c360-scorecard-block" hidden></div>

            <!-- Existing Customer 360 sections render into here -->
            <main id="c360-content" class="c360-content"></main>

            <footer class="c360-footer">
                <p>Internal use only. Intelligence on this page is derived from the records
                   listed in the Sources section; interpretations are labelled with a
                   confidence level. Health and priority are calculated separately and are
                   allowed to disagree.</p>
            </footer>
        </div>

        <!--
            Portfolio AI drawer. A right-side panel, never a takeover — the
            dashboard stays visible and clickable behind it, because the
            answers are about what is on it.
        -->
        <aside id="c360-aidrawer" hidden></aside>

        <!-- Brief modal overlay -->
        <div id="c360-modal" class="c360-overlay" hidden></div>
    </div>

    <!--
        No build step and no dependencies, matching the other add-ins here.
        Load order is dependency order: core, then normalisation, then
        services, then the intelligence engine, then the scorecard engines,
        then the UI.
    -->

    <!-- Core -->
    <script src="js/core/namespace.js"></script>
    <script src="js/core/config.js"></script>
    <script src="js/core/scorecardConfig.js"></script>
    <script src="js/core/util.js"></script>
    <script src="js/core/cache.js"></script>

    <!-- Normalisation (services reference it lazily, at call time) -->
    <script src="js/intelligence/normalize.js"></script>

    <!-- Data sources -->
    <script src="js/services/mockData.js"></script>
    <script src="js/services/gatewayClient.js"></script>
    <script src="js/services/dataSource.js"></script>
    <script src="js/services/cachedService.js"></script>

    <!-- Services -->
    <script src="js/services/accountService.js"></script>
    <script src="js/services/quoteService.js"></script>
    <script src="js/services/orderService.js"></script>
    <script src="js/services/ticketService.js"></script>
    <script src="js/services/billingService.js"></script>
    <script src="js/services/technicalService.js"></script>
    <script src="js/services/accountReviewService.js"></script>
    <script src="js/services/websiteResearchService.js"></script>
    <script src="js/services/webResearchService.js"></script>
    <script src="js/services/contactService.js"></script>
    <script src="js/services/geotabService.js"></script>
    <!-- Scorecard sources: device health, portal usage, contract, commitments,
         communications, outcomes. None is connected to a real system today. -->
    <script src="js/services/scorecardSourceService.js"></script>

    <!-- Intelligence engine: facts -> signals -> risks/opportunities -> actions -->
    <script src="js/intelligence/facts.js"></script>
    <script src="js/intelligence/signals.js"></script>
    <script src="js/intelligence/risks.js"></script>
    <script src="js/intelligence/opportunities.js"></script>
    <script src="js/intelligence/health.js"></script>
    <script src="js/intelligence/timeline.js"></script>
    <script src="js/intelligence/recommendations.js"></script>
    <script src="js/intelligence/summary.js"></script>
    <script src="js/intelligence/intelligenceEngine.js"></script>

    <!--
        Scorecard engine: identity -> segment -> health -> priority -> queues
        -> actions. Load order is dependency order, same rule as everything
        above: the shared evidence and detection helpers first, then Phase 1,
        then each phase that reads the one before it.

        Note that priority.js loads AFTER healthScore.js only for readability —
        priority never reads a health score, which is what lets the two numbers
        legitimately disagree.
    -->
    <script src="js/scorecard/evidence.js"></script>
    <script src="js/scorecard/detect.js"></script>
    <script src="js/scorecard/identity.js"></script>
    <script src="js/scorecard/segments.js"></script>
    <script src="js/scorecard/confidence.js"></script>
    <script src="js/scorecard/healthScore.js"></script>
    <script src="js/scorecard/overrides.js"></script>
    <script src="js/scorecard/priority.js"></script>
    <script src="js/scorecard/queues.js"></script>
    <script src="js/scorecard/actionRules.js"></script>
    <script src="js/scorecard/actionEngine.js"></script>
    <script src="js/scorecard/scorecardEngine.js"></script>
    <script src="js/scorecard/history.js"></script>
    <script src="js/scorecard/portfolio.js"></script>
    <script src="js/scorecard/brief.js"></script>
    <script src="js/scorecard/portfolioQuery.js"></script>

    <!-- AI + approval. ai.enabled is false; sendingEnabled is false. -->
    <script src="js/scorecard/ai.js"></script>
    <script src="js/scorecard/approval.js"></script>

    <!-- Feedback + metrics -->
    <script src="js/scorecard/feedback.js"></script>
    <script src="js/scorecard/metrics.js"></script>

    <!-- Orchestration + UI -->
    <script src="js/orchestrator.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui/parts.js"></script>
    <script src="js/ui/render.js"></script>
    <script src="js/ui/feedback.js"></script>
    <script src="js/ui/approval.js"></script>
    <script src="js/ui/scorecard.js"></script>
    <script src="js/ui/shell.js"></script>
    <script src="js/ui/brief.js"></script>
    <script src="js/ui/portfolioAi.js"></script>
    <script src="js/ui/accountWorkspace.js"></script>
    <script src="js/ui/portfolio.js"></script>
    <script src="js/ui/app.js"></script>

    <!-- MyGeotab lifecycle (last: everything above must already exist) -->
    <script src="js/addin.js"></script>
</body>
</html>
